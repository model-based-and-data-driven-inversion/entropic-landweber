[project]
name = "entropic-landweber"
version = "0.1.0"
description = "Python replication of An entropic Landweber method for linear ill-posed problems (Burger, Resmerita, Benning, 2020)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
